<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>게임 상세 · 청소년 AI게임개발 헤커톤</title>
  <link rel="stylesheet" href="./css/common.css?v=20261010-6" />
  <link rel="stylesheet" href="./css/game-detail.css?v=20261017-4" />
</head>
<body class="game-detail-page">
  <header class="game-detail-header">
    <div class="game-detail-header-inner">
      <a class="game-detail-back" href="/">게임 광장으로 돌아가기</a>
      <p class="game-detail-event-name">청소년 AI게임개발 헤커톤</p>
      <h1>게임 상세</h1>
    </div>
  </header>

  <main class="game-detail-main">
    <p id="detailLoadStatus" class="detail-load-status" role="status" aria-live="polite">게임 정보를 불러오는 중입니다.</p>
    <article id="gameDetail" class="game-detail-card" aria-busy="true"></article>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-event-name">청소년 AI게임개발 헤커톤</p>
      <p class="footer-description">본 사이트는 해커톤 참가 작품 공개 및 방문객 투표를 위해 운영됩니다.</p>
      <nav class="footer-links" aria-label="정책 및 운영 안내">
        <a href="/privacy">개인정보 처리방침</a>
        <a href="/rewards">캐시 지급 안내</a>
        <a href="/participation">행사 운영 안내</a>
        <a href="/privacy#contact">운영 문의</a>
      </nav>
      <p class="footer-operator">주최·운영: <span class="footer-operator-brand"><img class="footer-operator-mark" src="/images/kevin-logo.jpg" alt="" /><span>안산케빈샘AI코딩학원</span></span></p>
    </div>
  </footer>

  <dialog id="detailVoteDialog" class="dialog" aria-labelledby="detailVoteDialogTitle" aria-describedby="detailVoteDialogText">
    <form method="dialog" class="dialog-card">
      <p class="eyebrow">투표</p>
      <h2 id="detailVoteDialogTitle">이 작품에 투표할까요?</h2>
      <p id="detailVoteDialogText" class="muted"></p>
      <p class="warning-text">투표 후에는 변경할 수 없습니다.</p>
      <div class="dialog-actions">
        <button class="button button-secondary" value="cancel">취소</button>
        <button id="detailConfirmVoteButton" class="button button-primary" value="default">투표하기</button>
      </div>
    </form>
  </dialog>

  <div id="detailToast" class="toast" role="status" aria-live="polite"></div>

  <script src="./js/config.js?v=20261003-4"></script>
  <script src="./js/api.js?v=20261003-4"></script>
  <script src="./js/visitor.js?v=20261010-2"></script>
  <script src="./js/game-detail.js?v=20261017-3"></script>
</body>
</html>
